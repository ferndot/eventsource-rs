[workspace]
resolver = "3"
members = [
    "crates/eventsource-core",
    "crates/eventsource-memory",
    "crates/eventsource-rabbitmq",
    "crates/eventsource-redis",
    "crates/eventsource-sqlite",
    "crates/eventsource-testing",
    "crates/eventsource-testkit",
    "crates/eventsource-otel",
    "crates/eventsource-postgres",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
lapin = { version = "=4.12.3", default-features = false, features = ["tokio"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "streams"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
